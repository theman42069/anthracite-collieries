<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coal Empire</title>
<style>
:root{
  --bg:#14100c; --bg2:#1b1510; --panel:#211a14; --panel2:#2a2119; --line:#3b2e22; --line2:#4d3c2c;
  --text:#ebdfca; --dim:#a8977e; --faint:#6e604e;
  --lamp:#ffb347; --lamp2:#ffd27a; --money:#a9d870; --bad:#e2603f; --good:#86c66f; --blue:#82b4d8; --purple:#b78fd8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.35 ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);
  border-radius:4px;padding:5px 9px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#3a2d20;border-color:var(--lamp)}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:#5a3a14;border-color:#9a6326;color:#ffe2b0}
button.primary:hover:not(:disabled){background:#744b1a}
button.danger{border-color:#7a3626;color:#f3b4a2}
button.small{padding:2px 7px;font-size:12px}
select,textarea,input{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:4px}
select{padding:2px 4px;font-size:12px;max-width:100%}
textarea{width:100%;min-height:90px;padding:6px;font-size:11px;word-break:break-all}
h3{margin:14px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
h3:first-child{margin-top:2px}
.dim{color:var(--dim)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .money{color:var(--money)} .lampc{color:var(--lamp)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:6px 18px;padding:6px 12px;background:#0f0c09;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:150px;cursor:pointer}
.brand:hover span{color:var(--lamp2)}
.brand b{font-size:15px;letter-spacing:.18em;color:var(--lamp)}
.brand span{font-size:11px;color:var(--dim)}
.res{display:flex;flex-direction:column;min-width:74px}
.res .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.res .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.savechip{cursor:pointer;padding:2px 6px;margin:-2px -6px;border-radius:4px}
.savechip:hover{background:var(--panel2)}
.savechip .val{font-size:12px}

#main{flex:1;display:flex;min-height:0}
#view{position:relative;flex:1;min-width:0;overflow:hidden;background:#0a0807;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#view.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,2px)}30%{transform:translate(4px,-3px)}45%{transform:translate(-3px,-2px)}60%{transform:translate(3px,2px)}80%{transform:translate(-1px,1px)}}
#mine{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;font-weight:700;color:var(--lamp2);text-shadow:0 1px 0 #000,0 0 6px rgba(255,170,60,.6);
  animation:floatUp 1s ease-out forwards;white-space:nowrap;font-size:14px}
.float.money{color:var(--money)}
@keyframes floatUp{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
#siteBar{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;background:rgba(10,8,6,.78);
  border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px}
#siteBar button{padding:0 7px}
#hint{position:absolute;right:8px;bottom:8px;font-size:11px;color:var(--dim);background:rgba(10,8,6,.7);padding:3px 7px;border-radius:4px;pointer-events:none}
#warn{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60%}
#warn div{background:rgba(70,22,12,.85);border:1px solid #8a3a24;border-radius:4px;padding:2px 7px;font-size:11px;color:#ffc9b6}
#warn div.info{background:rgba(20,30,40,.85);border-color:#34506a;color:#cfe3f5}
#eventBanner{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));
  background:rgba(28,20,14,.96);border:1px solid var(--lamp);border-radius:6px;padding:10px 12px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#eventBanner .t{font-weight:700;color:var(--lamp2);font-size:14px}
#eventBanner .x{margin:4px 0 8px;color:var(--text)}
.choices{display:flex;flex-direction:column;gap:5px}
.choices button{text-align:left;display:flex;flex-direction:column;gap:1px}
.choices button small{color:var(--dim);font-size:11px}
.evtimer{height:3px;background:#3a2c1f;margin-top:8px;border-radius:2px;overflow:hidden}
.evtimer i{display:block;height:100%;background:var(--lamp);width:100%}

#panel{width:440px;max-width:46%;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:#191410;scrollbar-width:none}
#tabs button{border:0;border-radius:0;background:none;padding:9px 11px;color:var(--dim);white-space:nowrap;border-bottom:2px solid transparent;position:relative}
#tabs button.on{color:var(--lamp2);border-bottom-color:var(--lamp)}
#tabs button .dot{position:absolute;top:5px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
#tabBody{flex:1;overflow-y:auto;padding:10px 12px 40px}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.bar{height:6px;background:#15100c;border-radius:3px;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a1e,var(--lamp))}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.wcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--rc,#888);border-radius:5px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.pool .wcard{min-height:172px}
.wstat[data-bind=wstat]{min-height:3.9em}
.wcard.empty{align-items:center;justify-content:center;color:var(--faint);min-height:96px;border-left-color:var(--line);border-style:dashed}
.wcard.hurt{opacity:.7}
.wname{font-weight:700}
.wrole{font-size:11px;color:var(--rc)}
.traits{display:flex;flex-wrap:wrap;gap:3px}
.trait{font-size:10.5px;padding:1px 5px;border-radius:9px;border:1px solid;cursor:help}
.trait.pos{color:#bfe3a6;border-color:#4e7a3a;background:#1f2d18}
.trait.neg{color:#f2b3a0;border-color:#7d3a28;background:#2e1712}
.trait.mix{color:#f0d999;border-color:#7a6430;background:#2b2412}
.traits .tr{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%}
.payrow{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.payrow input[type=range]{width:100%;accent-color:var(--lamp);border:0;background:none}
.trdesc{font-size:10.5px;line-height:1.25;color:var(--dim);padding-left:2px}
.wstat{font-size:11px;color:var(--dim)}
.wbtns{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lvlhead{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:10px 0 5px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.up{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:0}
.up .nm{font-weight:600}
.up .ds{font-size:11.5px;color:var(--dim)}
.up.locked{opacity:.45}
.up.owned .nm{color:var(--good)}
.tag{font-size:10px;padding:0 5px;border-radius:3px;background:#3a2b1d;color:var(--lamp2);margin-left:4px;vertical-align:1px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}
.ach div{border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:11px;background:var(--bg2);color:var(--faint)}
.ach div.got{color:var(--text);border-color:#6a5326;background:#2a2213}
.ach b{display:block;font-size:11.5px}
.log{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.log div{border-left:2px solid var(--line2);padding-left:6px}
.log .tm{color:var(--faint)}
table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st td{padding:3px 2px;border-bottom:1px solid var(--line)}
table.st td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:8px;align-items:center;padding:4px 0}
pre{white-space:pre-wrap;font-size:11px;background:var(--bg2);padding:6px;border-radius:4px;border:1px solid var(--line);margin:6px 0 0}

#toasts{position:fixed;left:12px;bottom:46px;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;max-width:min(360px,calc(100vw - 24px))}
.toast{background:rgba(30,22,15,.97);border:1px solid var(--line2);border-left:3px solid var(--lamp);border-radius:5px;padding:7px 10px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.ach{border-left-color:#d9b44a}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;background:rgba(5,4,3,.72);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border:1px solid var(--lamp);border-radius:8px;padding:16px 18px;width:min(460px,100%);max-height:90vh;overflow:auto}
#modal h2{margin:0 0 8px;color:var(--lamp2);font-size:17px}

@media (max-width:820px){
  #main{flex-direction:column}
  #view{flex:none;height:44vh;height:44dvh;min-height:220px}
  #panel{width:auto;max-width:none;flex:1;border-left:0;border-top:1px solid var(--line)}
  #topbar{gap:4px 12px;padding:5px 10px}
  .brand{min-width:100%;flex-direction:row;gap:8px;align-items:baseline}
  .res{min-width:0;flex:1 1 28%}
  .res .val{font-size:13.5px}
  #hint{display:none}
  #toasts{top:6px;bottom:auto;left:8px;right:8px;max-width:none;gap:4px}
  .toast{font-size:11px;padding:4px 8px}
}
@media (prefers-reduced-motion:reduce){ #view.shake{animation:none} .float{animation-duration:.6s} }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" data-act="renameCompany" title="Click to rename your company"><b>COAL EMPIRE</b><span id="tierName"></span></div>
    <div class="res"><span class="lbl">Coal</span><span class="val" id="rCoal">0</span></div>
    <div class="res"><span class="lbl">Money</span><span class="val money" id="rMoney">$0</span></div>
    <div class="res"><span class="lbl">Coal / sec</span><span class="val lampc" id="rCps">0</span></div>
    <div class="res"><span class="lbl">Price / ton</span><span class="val" id="rPrice">$1</span></div>
    <div class="res"><span class="lbl">Net $ / sec</span><span class="val" id="rNet">$0</span></div>
    <div class="res savechip" data-act="openSave" title="Save options"><span class="lbl">Progress</span><span class="val" id="rSave">—</span></div>
  </header>
  <div id="main">
    <section id="view">
      <canvas id="mine"></canvas>
      <div id="floaters"></div>
      <div id="warn"></div>
      <div id="siteBar"></div>
      <div id="hint">click the mine to dig</div>
      <div id="eventBanner" hidden></div>
    </section>
    <aside id="panel">
      <nav id="tabs"></nav>
      <div id="tabBody"></div>
    </aside>
  </div>
</div>
<div id="toasts"></div>
<div id="modal" hidden><div class="box"></div></div>

<script>
'use strict';
/* =====================================================================
   1. CONFIG — every balance number lives here
   ===================================================================== */
const CONFIG = {
  version: 1,
  saveKey: 'coalEmpire.save.v1',
  servedUrl: 'http://localhost:8000/games/coal-empire.html',   // where the saving copy lives when the preview can't store anything
  autosaveSec: 30,
  offlineCapHours: 8,
  offlineStepSec: 5,          // offline progress is simulated in steps of this size
  offlineMinSec: 20,          // shorter absences are ignored
  maxStepSec: 0.5,            // largest simulation step during normal play

  market: {
    basePrice: 1.0,           // $ per ton before multipliers
    reversion: 0.02,          // pull back toward 1.0 per second
    volatility: 0.045,        // random walk strength
    min: 0.55, max: 1.9,      // market multiplier bounds
    sellRate: 0.45,           // fraction of stockpile sold per second (exponential)
    smartLow: 0.93, smartHigh: 1.07,  // Sales Agent holds below / dumps above these
    smartSlowRate: 0.03, smartFastRate: 1.4,
  },
  click: { base: 1, cpsFrac: 0.05 },   // coal per click = base × dig mults + 5% of coal/sec

  wages: {
    growthPerSec: 0.00025,    // each worker's wage creeps up this much per second...
    organizerMult: 3,         // ...3× faster on a level with a Union Organizer
    cap: 1.6,                 // wage creep stops at +60%
    unpaidOutput: 0.5,        // output multiplier while you cannot make payroll
    unpaidSec: 6,
    tierMult: [1, 1, 3, 15, 80, 400],  // wage scale per tier (index = tier)
  },
  // Pay slider. Pay p (0.5–2.0): output ×(1 + outPerDouble·log2 p), wages ×p,
  // above 100% the crew also takes bonusShare·(p−1) of the money from the coal they dig,
  // and strike odds scale with (1/p)^strikePow.
  pay: {
    min: 0.5, max: 2, step: 0.05,
    outPerDouble: 0.4,
    bonusShare: 0.25,
    strikePow: 2,
  },

  roles: {
    digger:    { name:'Digger',         icon:'⛏', color:'#d0904c', cost:12,  growth:1.13, wage:0.04, dig:1.0,  weight:36,
                 desc:'Cuts coal at the face. Deeper levels yield more.' },
    hauler:    { name:'Hauler',         icon:'🛒', color:'#7aa2c8', cost:15,  growth:1.13, wage:0.035, haul:1.9, weight:27,
                 desc:'Moves coal to the surface. Hauling is pooled per site.' },
    engineer:  { name:'Engineer',       icon:'⚙', color:'#86c070', cost:220, growth:1.24, wage:0.3,  effect:0.15, weight:9,
                 desc:'+15% dig output for their level crew.' },
    safety:    { name:'Safety Officer', icon:'⛑', color:'#e88438', cost:160, growth:1.24, wage:0.22, effect:0.78, weight:9,
                 desc:'-22% accident chance on their level.' },
    foreman:   { name:'Foreman',        icon:'📋', color:'#e9e1cc', cost:380, growth:1.27, wage:0.45, effect:0.10, weight:10,
                 desc:'+10% dig and haul for their level crew; calms strikes.' },
    geologist: { name:'Geologist',      icon:'🔍', color:'#b28be0', cost:520, growth:1.27, wage:0.5,  effect:0.12, rich:0.0005, weight:9,
                 desc:'+12% depth yield on their level; finds rich seams.' },
  },
  workerLevel: { max:10, powerGrowth:1.3, wageGrowth:1.15, promoteBase:1.6, promoteGrowth:1.75 },
  superstitiousSec: 600,      // a mine is "new" for 10 minutes

  pool: { size:4, refreshSec:75, arriveSec:10, twoTraitChance:0.45, rerollFrac:0.3, rerollMin:5 },

  accident: { base:1, perDepth:0.22, minorPerSec:0.0005, minorInjurySec:90 },
  rich: { mult:3, sec:75 },

  sites: {
    driftMaxLevels: 3, collieryMaxLevels: 8,
    driftCap: 4, collieryCap: 6,         // workers per level
    driftBaseHaul: 1.0, collieryBaseHaul: 6,  // surface hoist moves this much per sec with no haulers
    depthYield: 0.6,                     // level k digs ×(1 + 0.6k)
    levelBase: 30, levelGrowth: 7,       // cost of level k = base × growth^k × site multiplier
    extra: [                             // additional named sites (main site is free)
      { name:'No. 2 Colliery',     tier:3, cost:6e5,  levelMult:8 },
      { name:'No. 3 Colliery',     tier:3, cost:2.5e7, levelMult:60 },
      { name:'Flagship Deep Mine', tier:4, cost:6e9,  levelMult:400 },
    ],
  },

  tiers: [
    null,
    { name:'Independent Drift Mine', company:'Your Drift Mine', desc:'One hand-dug tunnel into a Schuylkill County hillside.' },
    { name:'Colliery',               company:'Your Colliery', req:{coal:6000,  money:5000},  buy:'Sink a Shaft',
      desc:'Sink a vertical shaft, raise a headframe, build a breaker. Up to 8 levels, 6 workers each.' },
    { name:'Regional Coal Company',  company:'Black Diamond Coal Co.', req:{coal:1.2e6, money:7.5e5}, buy:'Incorporate',
      desc:'Buy more collieries, build a company town, lay a rail line. Unlocks selling the company.' },
    { name:'National Coal Corporation', company:'Black Diamond Consolidated', req:{coal:2e9, money:1e9}, buy:'Go National',
      desc:'Divisions in a dozen states, utility contracts, and Congress takes an interest.' },
    { name:'Global Energy Empire',   company:'Black Diamond International', req:{coal:2e12, money:1e12}, buy:'Go Global',
      desc:'Overseas mines, bulk carriers, a commodities desk and rivals with sharp elbows.' },
  ],

  // Upgrades. once:true = one-off milestone. per = effect per level. mult = milestone multiplier.
  upgrades: [
    { id:'tools',      cat:'Tools', name:'Tool Maintenance', base:25, growth:1.14, max:80, tier:1, per:0.10, desc:l=>`+${l*10}% dig output` },
    { id:'pneumatic',  cat:'Tools', name:'Pneumatic Drills', once:true, base:12000, tier:2, eff:'dig', mult:2,   desc:()=>'×2 dig output. Compressed air, now with more noise.' },
    { id:'electric',   cat:'Tools', name:'Electric Drills', once:true, base:1.5e6, tier:3, eff:'dig', mult:2.5, desc:()=>'×2.5 dig output.' },
    { id:'continuous', cat:'Tools', name:'Continuous Miners', once:true, base:5e8, tier:4, eff:'dig', mult:3,  desc:()=>'×3 dig output. The machine eats the seam.' },
    { id:'autonomous', cat:'Tools', name:'Autonomous Rigs', once:true, base:3e11, tier:5, eff:'dig', mult:4,   desc:()=>'×4 dig output. Nobody is quite sure who is driving.' },

    { id:'vent',     cat:'Ventilation, Pumps & Lighting', name:'Ventilation', base:60,  growth:4, max:7, tier:1, acc:0.05,
      desc:l=>`Air for ${1+l} level${l?'s':''} deep · -${l*5}% accidents · fewer gas pockets` },
    { id:'pumps',    cat:'Ventilation, Pumps & Lighting', name:'Pumps', base:90, growth:4, max:7, tier:1,
      desc:l=>`Keeps ${1+l} level${l?'s':''} dry · fewer floods` },
    { id:'lighting', cat:'Ventilation, Pumps & Lighting', name:'Lighting', base:60, growth:1.55, max:12, tier:1, per:0.04, acc:0.04,
      desc:l=>`+${l*4}% worker output · -${l*4}% accidents` },

    { id:'haulage',   cat:'Haulage', name:'Cart Maintenance', base:35, growth:1.14, max:80, tier:1, per:0.12, desc:l=>`+${l*12}% haul capacity` },
    { id:'mineRail',  cat:'Haulage', name:'Mine Rail & Cars', once:true, base:600,   tier:1, eff:'haul', mult:1.6, desc:()=>'×1.6 haul. Rails in every tunnel.' },
    { id:'skipHoist', cat:'Haulage', name:'Steam Skip Hoist', once:true, base:15000, tier:2, eff:'haul', mult:1.8, desc:()=>'×1.8 haul.' },
    { id:'conveyor',  cat:'Haulage', name:'Belt Conveyors',  once:true, base:1.1e6, tier:3, eff:'haul', mult:2.5, desc:()=>'×2.5 haul.' },
    { id:'trucks',    cat:'Haulage', name:'Diesel Haul Fleet', once:true, base:3e8, tier:4, eff:'haul', mult:3,   desc:()=>'×3 haul.' },
    { id:'slurry',    cat:'Haulage', name:'Slurry Pipeline', once:true, base:2e11,  tier:5, eff:'haul', mult:4,   desc:()=>'×4 haul.' },

    { id:'processing',   cat:'Processing', name:'Sizing & Grading', base:150, growth:1.2, max:60, tier:1, per:0.05, desc:l=>`+${l*5}% coal price` },
    { id:'pickingTable', cat:'Processing', name:'Slate Picking Table', once:true, base:400,   tier:1, eff:'price', mult:1.25, desc:()=>'×1.25 price. Boys pick out the rock.' },
    { id:'breaker',      cat:'Processing', name:'Coal Breaker', once:true, base:7000,  tier:2, eff:'price', mult:1.6,  desc:()=>'×1.6 price. Crushed, sized, and very loud.' },
    { id:'washery',      cat:'Processing', name:'Washery', once:true, base:8e5,   tier:3, eff:'price', mult:1.5,  desc:()=>'×1.5 price.' },
    { id:'prepPlant',    cat:'Processing', name:'Preparation Plant', once:true, base:2.5e8, tier:4, eff:'price', mult:1.6, desc:()=>'×1.6 price.' },
    { id:'terminal',     cat:'Processing', name:'Export Terminal', once:true, base:1.5e11, tier:5, eff:'price', mult:1.8, desc:()=>'×1.8 price.' },

    { id:'safety',   cat:'Safety & Training', name:'Safety Drills', base:80, growth:1.45, max:20, tier:1, acc:0.08, desc:l=>`-${l*8}% accidents (compounding)` },

const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n < 1000) s = n < 100 && n % 1 > 0.05 ? n.toFixed(1) : String(Math.floor(n));
  else {
    let e = Math.floor(Math.log10(n) / 3);
    if (e >= SUFFIX.length) s = n.toExponential(2).replace('+', '');
    else {
      let v = n / Math.pow(1000, e);
      let str = v < 100 ? (Math.floor(v * 10) / 10).toFixed(1) : String(Math.floor(v));
      s = str.replace(/\.0$/, '') + SUFFIX[e];
    }
  }
  return (neg ? '-' : '') + s;
}

  } catch (e) {

      get: () => window.name.startsWith(tag) ? window.name.slice(tag.length) : null,

function mergeDefaults(obj, def) {
  for (const k in def) {
    if (!(k in obj)) obj[k] = def[k];
    else if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k]) && obj[k] && typeof obj[k] === 'object') mergeDefaults(obj[k], def[k]);
  }
  return obj;
}

  for (const site of o.sites) for (const lv of site.levels) mergeDefaults(lv, newLevel());

}

function power(w) { return Math.pow(CONFIG.workerLevel.powerGrowth, w.lvl - 1); }

function assign(id, siteId, li) {
  const w = S.workers.find(x => x.id === id); const s = siteById(siteId); if (!w || !s || !s.levels[li]) return;
  if (w.site === siteId && w.li === li) return;
  if (crewCount(siteId, li) >= levelCap(s)) { toast('That level is full.', 'bad'); return; }
  w.site = siteId; w.li = li; ui.dirty = true;
}

/* --- sites & levels --- */
function siteIndex(site) { return S.sites.indexOf(site); }
function siteLevelMult(site) { const i = siteIndex(site); return i === 0 ? 1 : CONFIG.sites.extra[i - 1].levelMult; }
function maxLevelsByKind(site) { return site.kind === 'drift' ? CONFIG.sites.driftMaxLevels : CONFIG.sites.collieryMaxLevels; }
function depthAllowed() { return 1 + Math.min(upg('vent'), upg('pumps')); }
function levelCost(site) { const k = site.levels.length; return Math.ceil(CONFIG.sites.levelBase * Math.pow(CONFIG.sites.levelGrowth, k) * siteLevelMult(site)); }
function levelBlock(site) {
  if (site.levels.length >= maxLevelsByKind(site)) return site.kind === 'drift' ? 'A drift mine tops out at 3 levels. Sink a shaft (Colliery) to go deeper.' : 'Deepest workable level reached.';
  if (site.levels.length >= depthAllowed()) {
    const need = site.levels.length;
    return `Needs Ventilation ${need} and Pumps ${need}.`;
  }
  return '';
}
function buyLevel(siteId) {
  const s = siteById(siteId); if (!s || levelBlock(s)) return false;
  const c = levelCost(s); if (S.money < c) return false;
  S.money -= c; s.levels.push(newLevel()); ui.dirty = true;
  if (!RT.sim) { toast(`${s.name}: Level ${s.levels.length} opened at ${s.levels.length * 120} ft.`, 'good'); shake(); }
  return true;
}
function nextExtraSite() { const i = S.sites.length - 1; return CONFIG.sites.extra[i] || null; }
function buySite() {
  const x = nextExtraSite(); if (!x || S.tier < x.tier || S.money < x.cost) return false;
  S.money -= x.cost;
  const s = { id: S.nextSite++, kind:'colliery', name:x.name, born:S.time, haltUntil:0, levels:[newLevel()] };
  S.sites.push(s); S.viewSite = s.id; ui.dirty = true;
  if (!RT.sim) { toast(`Bought ${x.name}!`, 'good'); shake(); }
  return true;
}

/* --- upgrades & holdings --- */
function upgVisible(u) { return !u.perk || perk(u.perk); }
function upgCost(u) { return u.once ? u.base : Math.ceil(u.base * Math.pow(u.growth, upg(u.id))); }
function upgMaxed(u) { return u.once ? has(u.id) : upg(u.id) >= u.max; }
function buyUpgrade(id) {
  const u = UP[id]; if (!u || !upgVisible(u) || upgMaxed(u) || S.tier < u.tier) return false;
  const c = upgCost(u); if (S.money < c) return false;
  S.money -= c; S.upgrades[id] = upg(id) + 1; ui.dirty = true;
  if (id === 'recruiter' || id === 'personnel') poolTick();
  return true;
}
function holdCost(h) { return Math.ceil(h.base * Math.pow(h.growth, holding(h.id))); }
function buyHolding(id) {
  const h = HOLD[id]; if (!h || S.tier < h.tier || (h.max && holding(id) >= h.max)) return false;
  const c = holdCost(h); if (S.money < c) return false;
  S.money -= c; S.holdings[id] = holding(id) + 1; ui.dirty = true; return true;
}

/* --- tiers --- */
function nextTier() { return CONFIG.tiers[S.tier + 1] || null; }
function canTierUp() { const t = nextTier(); return !!t && S.run.coal >= t.req.coal && S.money >= t.req.money; }
function tierUp() {
  if (!canTierUp()) return false;
  const t = nextTier();
  S.money -= t.req.money; S.tier++;
  if (S.tier === 2) { const s = S.sites[0]; s.kind = 'colliery'; if (!s.custom) s.name = 'No. 1 Colliery'; s.born = S.time; }
  ui.dirty = true;
  if (!RT.sim) {
    shake(); toast(`You are now a ${t.name}!`, 'good');
    showModal(`<h2>${esc(t.name)}</h2><p>${esc(t.desc)}</p><p class="dim">New upgrades and buildings are available.</p><button class="primary" data-act="closeModal">Get to work</button>`);
  }
  return true;
}

/* --- derived stats --- */
function recalc() {
  const d = { sites:{}, cps:0, dig:0, haul:0, holdCps:0, wages:0, riskIndex:0.5, strike:1, geologists:0, gas:{}, organizers:0 };
  const R = CONFIG.roles;
  const achMult = 1 + CONFIG.achievementBonus * Object.keys(S.meta.ach).length;
  const legMult = 1 + CONFIG.prestige.perPoint * S.meta.legacy;
  const general = achMult * legMult * S.perm.out * buffProd('out') * (has('trust') ? UP.trust.mult : 1);
  let digM = 1, haulM = 1, priceM = 1;
  for (const u of CONFIG.upgrades) if (u.once && has(u.id)) {
    if (u.eff === 'dig') digM *= u.mult; else if (u.eff === 'haul') haulM *= u.mult; else if (u.eff === 'price') priceM *= u.mult;
  }
  const digMult = (1 + UP.tools.per * upg('tools')) * digM;
  const haulMult = (1 + UP.haulage.per * upg('haulage')) * haulM;
  const unpaid = S.time < S.unpaidUntil;
  const workerMult = general * (1 + UP.lighting.per * upg('lighting')) * (1 + UP.training.per * upg('training'))
    * (1 + HOLD.house.workerOut * holding('house')) * (unpaid ? CONFIG.wages.unpaidOutput : 1) * payOutput();
  const accUp = Math.pow(1 - UP.safety.acc, upg('safety')) * Math.pow(1 - UP.lighting.acc, upg('lighting'))
    * Math.pow(1 - UP.vent.acc, upg('vent')) * S.perm.acc * buffProd('acc');
  d.general = general; d.digMult = digMult; d.haulMult = haulMult; d.workerMult = workerMult; d.unpaid = unpaid;

  const idx = {};
  for (const w of S.workers) { const k = w.site + ':' + w.li; (idx[k] || (idx[k] = [])).push(w); }
  let riskSum = 0, riskW = 0, foremen = 0, loud = 0;
  for (const site of S.sites) {
    const siteHalt = site.haltUntil > S.time;
    const base = (site.kind === 'drift' ? CONFIG.sites.driftBaseHaul : CONFIG.sites.collieryBaseHaul) * haulMult * general;
    const sd = { dig:0, haul: siteHalt ? 0 : base, baseHaul: base, levels:[], workers:0, cap: levelCap(site) * site.levels.length, gas:1, halted: siteHalt };
    site.levels.forEach((lv, li) => {
      const crew = idx[site.id + ':' + li] || [];
      const active = crew.filter(w => w.injuredUntil <= S.time);
      let team = 1, foreP = 0, engP = 0, geoP = 0, safP = 0, accT = 1;
      for (const w of crew) for (const t of traitsOf(w)) if (t.acc) accT *= t.acc;
      for (const w of active) {
        for (const t of traitsOf(w)) {
          if (t.team) team *= t.team; if (t.gas) sd.gas *= t.gas;
          if (t.strike) loud += t.strike; if (t.teamWage) d.organizers++;
        }
        if (w.role === 'foreman') { foreP += supportPower(w); foremen++; }
        else if (w.role === 'engineer') engP += supportPower(w);
        else if (w.role === 'geologist') { geoP += supportPower(w); d.geologists++; }
        else if (w.role === 'safety') safP += supportPower(w);
      }
      const halted = siteHalt || lv.haltUntil > S.time;
      const rich = lv.richUntil > S.time ? CONFIG.rich.mult : 1;
      const foreM = 1 + R.foreman.effect * foreP, engM = 1 + R.engineer.effect * engP, geoM = 1 + R.geologist.effect * geoP;
      const depthM = 1 + CONFIG.sites.depthYield * li;
      let dig = 0, haul = 0;
      for (const w of crew) w._out = 0;
      if (!halted) for (const w of active) {
        const so = selfOut(w, site);
        if (w.role === 'digger') {
          w._out = R.digger.dig * power(w) * so * team * foreM * engM * geoM * depthM * lv.bonus * rich * digMult * workerMult;
          dig += w._out;
        } else if (w.role === 'hauler') {
          let h = R.hauler.haul * power(w) * so * team * foreM * haulMult * workerMult;
          for (const t of traitsOf(w)) if (t.haul) h *= t.haul;
          w._out = h; haul += h;
        }
      }
      const risk = CONFIG.accident.base * (1 + CONFIG.accident.perDepth * li) * accT * Math.pow(R.safety.effect, safP) * accUp;
      sd.levels.push({ dig, haul, risk, crew: crew.length, active: active.length, halted, rich: rich > 1 });
      sd.dig += dig; sd.haul += haul; sd.workers += crew.length;
      if (crew.length) { riskSum += risk * crew.length; riskW += crew.length; }
    });
    sd.out = Math.min(sd.dig, sd.haul);
    sd.limit = sd.dig > sd.haul ? 'haul' : 'dig';
    d.gas[site.id] = sd.gas;
    d.sites[site.id] = sd;
    d.cps += sd.out; d.dig += sd.dig; d.haul += sd.haul;
  }
  let priceH = 1;
  for (const h of CONFIG.holdings) {
    const n = holding(h.id); if (!n) continue;
    if (h.cps) d.holdCps += n * h.cps * general * digM;
    if (h.price) priceH *= 1 + h.price * n;
  }
  d.cps += d.holdCps;
  if (RT.offline && perk('nightShift')) d.cps *= 1.5;
  for (const w of S.workers) if (w.injuredUntil <= S.time) d.wages += wageOf(w);   // injured workers are off shift and unpaid
  d.price = CONFIG.market.basePrice * S.market.mult * (1 + UP.processing.per * upg('processing')) * priceM * priceH * S.perm.price * buffProd('price');
  d.riskIndex = riskW ? riskSum / riskW : 0.5;
  d.strike = Math.max(0.2, 0.4 + loud * 0.1 + Math.min(1, S.workers.length / 120) - foremen * 0.3) * Math.pow(1 / S.pay, CONFIG.pay.strikePow);
  // the crew's bonus share only comes out of coal they dug, not holdings
  d.payCut = Math.max(0, S.pay - 1) * CONFIG.pay.bonusShare * (d.cps > 0 ? (d.cps - d.holdCps) / d.cps : 1);
  d.clickValue = CONFIG.click.base * digMult * workerMult + d.cps * CONFIG.click.cpsFrac;
  d.workers = S.workers.length; d.cap = totalCap();
  D = d;
}

/* --- economy tick --- */
function tick(dt) {
  S.time += dt;
  S.meta.playSec += dt;
  recalc();
  // production
  const mined = D.cps * dt;
  addCoal(mined);
  // selling
  const M = CONFIG.market;
  let rate = M.sellRate;
  if (has('salesAgent') && S.auto.sell) rate = S.market.mult < M.smartLow ? M.smartSlowRate : S.market.mult > M.smartHigh ? M.smartFastRate : M.sellRate;
  const sold = S.coal * (1 - Math.exp(-rate * dt));
  S.coal -= sold;
  const rev = sold * D.price * (1 - D.payCut);
  S.money += rev; S.run.money += rev; S.meta.lifetimeMoney += rev;
  // wages
  S.money -= D.wages * dt;
  if (S.money < 0) { S.money = 0; S.unpaidUntil = S.time + CONFIG.wages.unpaidSec; }
  // market drift
  const vol = M.volatility * Math.pow(HOLD.desk.vol, holding('desk'));
  const target = 1;
  S.market.mult += M.reversion * (target - S.market.mult) * dt + vol * Math.sqrt(dt) * gauss();
  S.market.mult = clamp(S.market.mult, perk('savvy') ? Math.max(0.8, M.min) : M.min, M.max);
  S.run.maxPrice = Math.max(S.run.maxPrice, S.market.mult);
  // workers: wage creep, minor injuries, lucky strikes
  const orgLevels = new Set();
  for (const w of S.workers) if (w.traits.includes('unionOrganizer')) orgLevels.add(w.site + ':' + w.li);
  for (const w of S.workers) {
    if (!w.traits.includes('companyMan') && w.wageMult < CONFIG.wages.cap)
      w.wageMult = Math.min(CONFIG.wages.cap, w.wageMult + CONFIG.wages.growthPerSec * dt * (orgLevels.has(w.site + ':' + w.li) ? CONFIG.wages.organizerMult : 1));
    if (w.injuredUntil > S.time) continue;
    const site = D.sites[w.site]; const lvd = site && site.levels[w.li];
    if (!lvd || lvd.halted) continue;
    if (!RT.offline && chance(CONFIG.accident.minorPerSec * lvd.risk, dt)) {
      w.injuredUntil = S.time + CONFIG.accident.minorInjurySec;
      logEvent(`${w.name} was hurt on Level ${w.li + 1}. Out for ${CONFIG.accident.minorInjurySec}s.`);
    }
    let rc = 0, dur = 1;
    for (const t of traitsOf(w)) { if (t.rich) rc += t.rich; if (t.richDur) dur = t.richDur; }
    if (w.role === 'geologist') rc += CONFIG.roles.geologist.rich * supportPower(w);
    if (rc && chance(rc, dt)) {
      const lv = siteById(w.site).levels[w.li];
      if (lv.richUntil <= S.time) {
        lv.richUntil = S.time + CONFIG.rich.sec * dur; S.run.rich++;
        logEvent(`${w.name} struck a rich seam on Level ${w.li + 1}! ×${CONFIG.rich.mult} output for ${CONFIG.rich.sec * dur}s.`);
        if (!RT.sim && !RT.offline) toast(`✨ ${w.name} hit a rich seam!`, 'good');
      }
    }
  }
  S.buffs = S.buffs.filter(b => b.until > S.time);
  poolTick();
  if (!RT.offline) eventTick();
}
function addCoal(n) { S.coal += n; S.run.coal += n; S.meta.lifetimeCoal += n; }
function mineClick() {
  const v = D.clickValue || 1;
  addCoal(v); S.run.clicks++; S.meta.clicks++;
  return v;
}
function stepGame(dt) {
  while (dt > 0) { const s = Math.min(dt, CONFIG.maxStepSec); tick(s); dt -= s; }
}
function slowTick() {   // once per game second
  checkAchievements();
  if (S.auto.hire && has('hiringClerk')) autoHire();
  if (S.auto.buy && has('purchasing')) autoBuy();
  if (S.auto.promote && has('personnel')) autoPromote();
}
function autoHire() {
  for (let guard = 0; guard < 3; guard++) {
    let best = null;
    for (const s of S.sites) { const sd = D.sites[s.id]; if (sd && sd.workers < sd.cap) { best = s; break; } }
    if (!best) return;
    const sd = D.sites[best.id];
    const want = sd.dig > sd.haul * 0.9 ? 'hauler' : 'digger';
    let pickI = -1, pickC = Infinity;
    S.pool.slots.forEach((sl, i) => { if (sl.c && sl.c.role === want) { const c = hireCost(sl.c); if (c < pickC) { pickC = c; pickI = i; } } });
    if (pickI < 0 || pickC > S.money * 0.5) return;
    hire(pickI, best.id); recalc();
  }
}
function autoBuy() {
  let best = null, bc = Infinity;
  for (const u of CONFIG.upgrades) {
    if (u.once || !upgVisible(u) || S.tier < u.tier || upgMaxed(u)) continue;
    const c = upgCost(u); if (c < bc) { bc = c; best = u; }
  }
  if (best && bc <= S.money * 0.5) buyUpgrade(best.id);
}
function autoPromote() {
  for (const w of S.workers) { if (w.lvl < CONFIG.workerLevel.max) { const c = promoteCost(w); if (c < S.money * 0.05) promote(w.id); } }
}

/* --- offline progress --- */
function runOffline(sec) {
  sec = Math.min(sec, CONFIG.offlineCapHours * 3600);
  if (sec < CONFIG.offlineMinSec) return null;
  const c0 = S.run.coal, m0 = S.money;
  RT.offline = true;
  const step = CONFIG.offlineStepSec;
  let t = sec;
  while (t > 0) { const s = Math.min(step, t); tick(s); t -= s; }
  RT.offline = false;
  recalc();
  return { sec, coal: S.run.coal - c0, money: S.money - m0 };
}
function showOffline(r) {
  if (!r) return;
  showModal(`<h2>While you were away</h2>
    <p>The crew kept at it for <b>${fmtTime(r.sec)}</b>${r.sec >= CONFIG.offlineCapHours * 3600 ? ' (capped)' : ''}.</p>
    <table class="st"><tr><td>Coal mined</td><td>${fmt(r.coal)}</td></tr><tr><td>Money gained (after wages)</td><td class="money">${money(r.money)}</td></tr></table>
    <p class="dim">Events don't happen while you're gone. The pit is quieter without you watching.</p>
    <button class="primary" data-act="closeModal">Back to the face</button>`);
}

/* --- events --- */
function pickLevel(byRisk, needDiggers) {
  const opts = [];
  for (const s of S.sites) s.levels.forEach((lv, li) => {
    const n = crewCount(s.id, li); if (!n) return;
    const lvd = D.sites[s.id].levels[li]; if (lvd.halted) return;
    opts.push([{ site: s.id, li }, byRisk ? lvd.risk * n : n]);
  });
  return wpick(opts);
}
const lvlName = (siteId, li) => { const s = siteById(siteId); return `${s ? s.name : '?'}, Level ${li + 1}`; };
function haltLevel(siteId, li, sec, kind) { const s = siteById(siteId); if (!s || !s.levels[li]) return; const lv = s.levels[li]; lv.haltUntil = Math.max(lv.haltUntil, S.time + sec); lv.haltKind = kind; }
function haltSite(siteId, sec, kind) { const s = siteById(siteId); if (!s) return; s.haltUntil = Math.max(s.haltUntil, S.time + sec); s.haltKind = kind; }
function injureOn(siteId, li, n, sec) {
  const crew = S.workers.filter(w => w.site === siteId && (li == null || w.li === li) && w.injuredUntil <= S.time);
  const hurt = [];
  for (let i = 0; i < n && crew.length; i++) { const w = crew.splice(Math.floor(Math.random() * crew.length), 1)[0]; w.injuredUntil = S.time + sec; hurt.push(w.name); }
  return hurt;
}
function pay(n) { const p = Math.min(S.money, n); S.money -= p; return p; }

function eventTick() {
  const ev = S.ev;
  if (ev.cur) { if (S.time >= ev.cur.expires) resolveEvent(EVBYID[ev.cur.id].def, true); return; }
  if (S.time < ev.nextAt || S.workers.length < 2) return;
  spawnEvent();
}
function spawnEvent(forceId) {
  const opts = EVENTS.filter(e => !forceId || e.id === forceId).map(e => [e, forceId ? 1 : e.weight()]);
  const def = wpick(opts);
  S.ev.nextAt = S.time + rand(...CONFIG.events.interval);
  if (!def) return;
  const data = def.make(); if (!data) return;
  S.ev.cur = Object.assign({ id: def.id, expires: S.time + CONFIG.events.decideSec, start: S.time }, data);
  S.run.events++;
  if (!RT.sim) { shake(); renderEventBanner(); ui.dirty = true; }
}
function resolveEvent(i, auto) {
  const cur = S.ev.cur; if (!cur) return;
  const def = EVBYID[cur.id]; const ch = def.choices[i]; if (!ch) return;
  if (ch.cost && !auto && S.money < ch.cost(cur)) return;
  const msg = ch.run(cur);
  if (def.after) def.after(cur);
  S.ev.cur = null;
  logEvent(`<b>${esc(def.title)}</b> ${auto ? '(no answer, so:) ' : ''}${esc(ch.label)} — ${esc(msg)}`, true);
  if (!RT.sim) { renderEventBanner(); toast(`${def.title}: ${msg}`); ui.dirty = true; }
}

/* --- pacing simulation (debug) --- */
function botStep() {
  if (canTierUp()) tierUp();
  const nt = nextTier(), saving = nt && S.run.coal >= nt.req.coal;   // a sensible player saves up for the tier
  if (S.tier >= 3 && nextExtraSite() && S.money >= nextExtraSite().cost && S.tier >= nextExtraSite().tier) buySite();
  recalc();
  // hire for the most constrained site
  for (let g = 0; g < 4; g++) {
    const site = S.sites.find(s => D.sites[s.id].workers < D.sites[s.id].cap); if (!site) break;
    const sd = D.sites[site.id];
    const want = sd.dig > sd.haul * 0.9 ? 'hauler' : (S.tier >= 2 && Math.random() < 0.15 ? pick(['foreman', 'engineer', 'geologist', 'safety']) : 'digger');
    let pi = -1, pc = Infinity;
    S.pool.slots.forEach((sl, i) => { if (sl.c && sl.c.role === want) { const c = hireCost(sl.c); if (c < pc) { pc = c; pi = i; } } });
    if (pi < 0 || pc > S.money || (saving && pc > S.money * 0.05)) break;
    hire(pi, site.id); recalc();
  }
  // cheapest of: upgrade, level, holding
  for (let g = 0; g < 6; g++) {
    const opts = [];
    for (const u of CONFIG.upgrades) if (upgVisible(u) && S.tier >= u.tier && !upgMaxed(u)) {
      if ((u.id === 'vent' || u.id === 'pumps') && S.sites.every(s => s.levels.length < depthAllowed() || s.levels.length >= maxLevelsByKind(s))) continue;
      if (u.id === 'safety' && upg('safety') > 8) continue;
      opts.push([upgCost(u), () => buyUpgrade(u.id)]);
    }
    for (const s of S.sites) if (!levelBlock(s) && D.sites[s.id].workers >= D.sites[s.id].cap - 1) opts.push([levelCost(s) * 0.5, () => buyLevel(s.id)]);
    for (const h of CONFIG.holdings) if (S.tier >= h.tier && !(h.max && holding(h.id) >= h.max)) opts.push([holdCost(h), () => buyHolding(h.id)]);
    opts.sort((a, b) => a[0] - b[0]);
    if (!opts.length || opts[0][0] > S.money || (saving && opts[0][0] > S.money * 0.05)) break;
    opts[0][1](); recalc();
  }
}
function simulatePacing(minutes, clicksPerSec) {
  const backup = serialize();
  RT.sim = true;
  const out = [];
  try {
    startRun(defaultMeta());
    let lastTier = 1, prestigeAt = null;
    for (let t = 1; t <= minutes * 60; t++) {
      if (t <= 300) for (let c = 0; c < clicksPerSec; c++) { recalc(); mineClick(); }
      stepGame(1);
      if (S.ev.cur) resolveEvent(EVBYID[S.ev.cur.id].def, true);
      slowTick();
      botStep();
      if (S.tier !== lastTier) { out.push(`${fmtTime(t).padStart(8)}  reached tier ${S.tier} (${CONFIG.tiers[S.tier].name})`); lastTier = S.tier; }
      if (prestigeAt == null && legacyGain() > 0) { prestigeAt = t; out.push(`${fmtTime(t).padStart(8)}  can sell company (+${legacyGain()} Legacy)`); }
      if (t % 300 === 0) out.push(`${fmtTime(t).padStart(8)}  ${fmt(D.cps)}/s  ${money(S.money)}  ${S.workers.length} workers  legacy ${legacyGain()}`);
    }
  } finally {
    RT.sim = false;
    S = loadFrom(backup); recalc(); ui.dirty = true;
  }
  return out.join('\n');
}

const PAL = {

const _shade = new Map();
function shade(hex, f) {
  const k = hex + f; let v = _shade.get(k); if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  v = `rgb(${clamp(((n >> 16) & 255) * f | 0, 0, 255)},${clamp(((n >> 8) & 255) * f | 0, 0, 255)},${clamp((n & 255) * f | 0, 0, 255)})`;
  _shade.set(k, v); return v;
}
function box(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function line(c, x0, y0, x1, y1, col) {
  c.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0 || 1;
  for (let i = 0; i <= n; i++) c.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
}
const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
function noise1(x) { const i = Math.floor(x), u = smooth(x - i); return hash(i) * (1 - u) + hash(i + 1) * u; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), u = smooth(x - xi), v = smooth(y - yi);
  const h = (a, b) => hash(a * 57.13 + b * 311.7);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (const [o, col] of stops) gr.addColorStop(o, col);

}

function resizeCanvas() {

  Rr.px = p;
  Rr.W = Math.round(r.width / p); Rr.H = Math.round(r.height / p);

  Rr.cv.style.width = Rr.W * p + 'px'; Rr.cv.style.height = Rr.H * p + 'px';
  Rr.cv.style.imageRendering = Number.isInteger(p) ? 'pixelated' : 'auto';

function viewSite() { return siteById(S.viewSite) || S.sites[0]; }
function layout(site) {
  const W = Rr.W, H = Rr.H, Sy = Rr.S;
  const sp = (H - Sy - 12) / CONFIG.sites.collieryMaxLevels;
  const th = clamp(Math.floor(sp * 0.64), 13, 22);

  return { W, H, Sy, sp, th, drift, sx, adit: 100, x0: drift ? 124 : sx + 12, x1: W - 6, y: i => Math.round(Sy + 12 + sp * i + th) };
}
// the drift's slope runs from the adit down to where level 3 would be
function slopeX(L, y) { return L.adit + 8 + (y - L.Sy) / (L.y(2) - L.Sy) * (L.x0 - L.adit - 8); }
const toolTierNow = () => has('autonomous') ? 4 : has('continuous') ? 3 : has('electric') ? 2 : has('pneumatic') ? 1 : 0;

function buildStrata() {
  const W = Rr.W, H = Rr.H, Sy = Rr.S, key = W + 'x' + H + ':' + Sy;
  if (Rr.strataKey === key) return;
  Rr.strataKey = key;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H - Sy), d = img.data;
  const rocks = [[104, 88, 68], [76, 72, 68], [56, 50, 45], [92, 78, 60], [84, 72, 58], [66, 59, 52], [98, 92, 84]];
  const L = layout({ kind: 'colliery' });
  const seams = []; for (let i = 0; i < CONFIG.sites.collieryMaxLevels; i++) seams.push(L.y(i) - L.th / 2);
  for (let yy = 0; yy < H - Sy; yy++) {
    const Y = Sy + yy, depth = yy / (H - Sy);
    for (let x = 0; x < W; x++) {
      const warp = noise2(x * 0.012, Y * 0.02) * 8 + x * 0.018;
      const band = Math.floor((Y + warp) / 7);
      let [r, gg, b] = rocks[Math.floor(hash(band * 1.37) * rocks.length)];
      const grain = (hash(x * 13.1 + Y * 7.7) - 0.5) * 16 + (noise2(x * 0.22, Y * 0.3) - 0.5) * 18;
      const k = (1 - depth * 0.5) * (hash(band * 3.1) < 0.15 ? 0.82 : 1);
      r = r * k + grain; gg = gg * k + grain; b = b * k + grain;
      for (let s = 0; s < seams.length; s++) {
        const cy = seams[s] + Math.sin(x * 0.017 + s) * 2 + (noise1(x * 0.05 + s * 9) - 0.5) * 3;
        const half = L.th / 2 + 1 + noise1(x * 0.03 + s * 4) * 3;
        if (Math.abs(Y - cy) < half) {
          const lus = hash(x * 3.3 + Y * 5.1) > 0.988;
          r = 20 + grain * 0.3; gg = 19 + grain * 0.3; b = 21 + grain * 0.3;
          if (Math.abs(Y - cy) > half - 1.5) { r += 10; gg += 9; b += 8; }   // shaly partings at the seam edges
          if (lus) { r = 58; gg = 62; b = 72; }

        }

      if (yy < 5) { const t = yy / 5; r = 74 * (1 - t) + r * t; gg = 58 * (1 - t) + gg * t; b = 40 * (1 - t) + b * t; }
      if (hash(x * 0.71 + Y * 1.93) > 0.994) { r *= 0.6; gg *= 0.6; b *= 0.6; }   // fractures and pebbles
      const o = (yy * W + x) * 4;
      d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, Sy);
  Rr.strata = c;
}

/* --- surface plan: where everything stands (shared by static and moving layers) --- */

/* --- buildings --- */
function building(g, x, ground, w, h, base, o) {
  o = o || {};

  for (let k = 0; k < w; k += 3) if (hash(x + k * 5.3) < 0.35) box(g, x + k, top + 1, 1, Math.floor(h * hash(k + x)), 'rgba(20,16,12,.18)');   // weather streaks
  box(g, x + w - 1, top, 1, h, shade(base, 1.22));   // sunlit side
  box(g, x, top, 1, h, shade(base, 0.68));
  box(g, x, ground - 1, w, 1, 'rgba(0,0,0,.3)');

    }

  else if (o.roof === 'shed') { for (let k = 0; k < 4; k++) box(g, x - 2, top - 4 + k, w + 4 - (3 - k) * 2, 1, shade(rc, 0.9 + k * 0.08)); }

/* --- underground static: shaft or slope, gangways, timbering, rails --- */
function drawShaft(g, L, site) {
  const sx = L.sx, Sy = L.Sy, deep = L.y(site.levels.length - 1) + 8;
  box(g, sx, Sy, 12, deep - Sy, '#0b0908');
  for (let y = Sy; y < deep; y += 4) box(g, sx, y, 12, 1, '#2e2216');
  box(g, sx, Sy, 2, deep - Sy, PAL.timberLo); box(g, sx + 10, Sy, 2, deep - Sy, PAL.timberLo);
  box(g, sx + 7, Sy, 1, deep - Sy, '#4e3520');
  for (let y = Sy + 2; y < deep; y += 3) box(g, sx + 8, y, 2, 1, '#6b4a2b');   // ladderway
  box(g, sx + 2, Sy, 1, deep - Sy, '#55504a'); box(g, sx + 6, Sy, 1, deep - Sy, '#55504a');   // cage guides
  box(g, sx + 2, deep - 4, 8, 4, '#22374a'); box(g, sx + 2, deep - 4, 8, 1, '#4a6a84');   // sump
}
function drawSlope(g, L, site) {
  const deep = L.y(site.levels.length - 1);
  for (let y = L.Sy - 15; y <= deep; y++) {
    const xs = Math.round(slopeX(L, Math.max(L.Sy, y)));
    for (let x = xs - 7; x < xs + 6; x++) box(g, x, y, 1, 1, hash(x * 7.3 + y * 3.1) > 0.7 ? '#1c1814' : '#141110');
    box(g, xs + 4, y, 1, 1, PAL.rail);
    if (y % 9 === 0) { box(g, xs - 7, y, 2, 1, PAL.timber); box(g, xs + 4, y, 2, 1, PAL.timber); box(g, xs - 7, y - 1, 13, 1, PAL.timberLo); }
  }
}
function carveLevel(g, L, site, i) {
  const y = L.y(i), top = y - L.th, xs = L.drift ? Math.round(slopeX(L, y)) : L.x0, x1 = L.x1, T = S.tier;
  for (let x = xs; x < x1; x++) {
    const rt = top + Math.round((noise1(x * 0.11 + i * 31) - 0.5) * 3);
    const fl = y + Math.round((noise1(x * 0.19 + i * 17) - 0.4) * 1.2);
    for (let yy = rt; yy < fl; yy++) {
      const v = hash(x * 7.31 + yy * 3.17 + i);
      g.fillStyle = v > 0.985 ? '#4a4e58' : v > 0.7 ? '#1c1814' : '#141110';
      g.fillRect(x, yy, 1, 1);
    }
    box(g, x, fl - 2, 1, 2, hash(x * 1.3 + i) < 0.5 ? '#2c241b' : '#33291f');
    if (noise1(x * 0.05 + i * 3) > 0.8) box(g, x, fl - 2, 1, 1, '#3a4a58');   // puddles
    box(g, x, rt, 1, 1, '#3a2a1c');
  }
  for (let xx = xs + 10; xx < x1 - 16; xx += 22) {   // timber sets: posts, cap, lagging
    box(g, xx, top + 1, 2, L.th - 1, PAL.timber); box(g, xx + 1, top + 1, 1, L.th - 1, PAL.timberLo);
    box(g, xx - 2, top, 6, 2, PAL.timberHi); box(g, xx - 1, y - 2, 4, 1, PAL.timberLo);
    for (let k = 3; k < 21; k += 4) box(g, xx + k, top, 3, 1, '#5a3f27');
    if (((xx - xs) / 22 | 0) % 3 === 1) { box(g, xx + 10, top - 6, 5, 7, '#0e0b09'); box(g, xx + 10, top - 2, 5, 1, PAL.timberLo); }   // chute into the breast above
  }
  if (has('mineRail') || T >= 2) {
    for (let x = xs; x < x1 - 4; x += 4) box(g, x, y - 1, 3, 1, '#3d2e20');
    box(g, xs, y - 2, x1 - xs - 4, 1, '#6f6b66');
  }
  if (T >= 2) {   // compressed-air line
    box(g, xs, top + 3, x1 - xs - 8, 1, '#56595f');
    for (let x = xs + 6; x < x1 - 8; x += 28) box(g, x, top + 2, 1, 3, '#6c7077');
  }
  if (T >= 3) for (let xx = xs + 10; xx < x1 - 38; xx += 22) for (let k = 0; k < 22; k++) box(g, xx + k, top + 5 + Math.round(Math.sin(Math.PI * k / 22) * 2), 1, 1, '#1f1f22');
  if (has('conveyor')) {
    box(g, xs + 4, y - 7, x1 - xs - 30, 1, '#2a2826');
    for (let x = xs + 4; x < x1 - 26; x += 6) box(g, x, y - 6, 1, 1, '#6c6a66');
    for (let x = xs + 6; x < x1 - 26; x += 12) box(g, x, y - 6, 1, 4, '#3a3836');
  }
  for (let yy = top; yy < y; yy++) {   // the coal face
    const w = 3 + Math.round(noise1(yy * 0.4 + i * 5) * 4);
    box(g, x1 - w, yy, w, 1, '#0d0c0d');
    if (hash(yy * 3 + i) > 0.7) box(g, x1 - w + 1, yy, 1, 1, '#525866');
  }
  for (let k = 0; k < 10; k++) box(g, x1 - 16 + k, y - 1 - Math.round(Math.sin(Math.PI * k / 10) * 3), 1, Math.round(Math.sin(Math.PI * k / 10) * 3) + 1, '#111012');
  if (!L.drift) { box(g, xs - 2, y - 1, 5, 1, PAL.timber); box(g, xs + 3, top + 4, 6, 3, '#6b4f33'); }
}
function underLayer(L, site) {
  const key = [L.W, L.H, L.Sy, site.id, site.kind, site.levels.length, S.tier, has('mineRail'), has('conveyor'), upg('vent'), upg('pumps')].join();
  if (key === Rr.underKey) return Rr.under;
  Rr.underKey = key;
  const c = document.createElement('canvas'); c.width = L.W; c.height = L.H;
  const g = c.getContext('2d');
  g.drawImage(Rr.strata, 0, 0);
  if (L.drift) drawSlope(g, L, site); else drawShaft(g, L, site);
  for (let i = 0; i < site.levels.length; i++) carveLevel(g, L, site, i);
  const n = site.levels.length;
  if (n < maxLevelsByKind(site)) {
    const y = L.y(n), xs = L.drift ? Math.round(slopeX(L, y)) : L.x0;
    g.strokeStyle = levelBlock(site) ? 'rgba(170,120,90,.28)' : 'rgba(255,190,100,.5)'; g.setLineDash([3, 3]);
    g.strokeRect(xs + 0.5, y - L.th + 0.5, L.x1 - xs - 1, L.th - 1); g.setLineDash([]);
  }
  Rr.under = c; return c;
}

/* --- people, animals, machines --- */
function drawMiner(c, x, b, role, o) {

  if (o.hurt) {
    box(c, x - 6, b - 3, 9, 3, shirt); box(c, x - 6, b - 2, 4, 2, PAL.trousers);
    box(c, x + 3, b - 4, 3, 3, PAL.skin); box(c, x + 3, b - 5, 3, 1, hat);
    box(c, x - 2, b - 8, 1, 3, '#c33'); box(c, x - 3, b - 7, 3, 1, '#c33');

  }

  const lean = o.act === 'push' ? f : o.act === 'shovel' && fr % 2 ? f : 0;

  box(c, x - 2 + lg, b - 1, 3, 1, PAL.boots); box(c, x + 1 - lg, b - 1, 3, 1, PAL.boots);
  const tx = x - 2 + lean;
  box(c, tx, b - 10, 5, 5, shirt); box(c, f > 0 ? tx : tx + 4, b - 10, 1, 5, dark);
  box(c, tx, b - 6, 5, 1, '#1d1915');
  if (role === 'foreman') box(c, tx + 1, b - 10, 3, 4, '#3a3530');
  if (role === 'safety') box(c, f > 0 ? tx : tx + 4, b - 9, 1, 2, '#e8822e');
  if (role === 'geologist') box(c, f > 0 ? tx : tx + 3, b - 7, 2, 2, '#6b4a2b');
  box(c, tx + 2, b - 8, 1, 1, shade(shirt, 0.6));
  const hx = x - 1 + lean;
  box(c, hx, b - 13, 3, 3, PAL.skin); box(c, f > 0 ? hx + 2 : hx, b - 12, 1, 1, PAL.grime);
  box(c, hx - 1, b - 14, 5, 1, hat); box(c, hx, b - 15, 3, 1, hat);

  const shx = x + lean + f, shy = b - 9;

      box(c, f > 0 ? dx : dx - 6, shy - 1, 6, 2, '#6d7076'); box(c, f > 0 ? dx + 6 + j : dx - 9 - j, shy, 3, 1, '#a0a4aa');
      if (o.tool >= 2) line(c, dx - f, shy + 1, dx - f * 9, b - 1, '#1a1a1a');
    } else {
      const P = [[-2, -7], [2, -7], [6, -2], [5, 1]][fr % 4];
      const ex = shx + P[0] * f, ey = shy + P[1];
      line(c, shx, shy, ex, ey, '#7a5a3a');
      box(c, ex - 1, ey - (P[1] < -3 ? 0 : 1), 3, 1, '#9aa0a6'); box(c, ex + f, ey, 1, 2, '#9aa0a6');
    }
  } else if (o.act === 'push') box(c, shx, shy, 3 * f, 1, shirt);
  else if (o.act === 'shovel') { const P = fr % 2 ? [5, 2] : [3, -3]; line(c, shx, shy, shx + P[0] * f, shy + P[1], '#7a5a3a'); box(c, shx + P[0] * f, shy + P[1], 2, 1, '#8a8e94'); }
  else if (o.act === 'idle') {
    if (role === 'foreman') box(c, shx + f, shy - 1, 2, 3, '#e8e2d0');
    else if (role === 'geologist') { const up = fr % 2; line(c, shx, shy, shx + f * 3, shy - 2 - up, '#7a5a3a'); box(c, shx + f * 3, shy - 3 - up, 1, 2, '#9aa0a6'); }
    else if (role === 'engineer') box(c, shx + f, shy, 3 * f, 1, '#8a8e94');
    else if (role === 'safety') { box(c, shx + f, shy - 3, 1, 3, shirt); box(c, shx + f, shy - 5, 2, 2, '#c9a24a'); lamp(shx + f, shy - 4, 14, 'warm', 0.7); }

/* --- per-frame drawing --- */

    c.fillStyle = '#24201c'; c.beginPath(); c.arc(cx, cy, 5, 0, 7); c.fill();
    for (let k = 0; k < 4; k++) { const a = t * 2.4 + k * Math.PI / 4; line(c, cx - Math.cos(a) * 5, cy - Math.sin(a) * 5, cx + Math.cos(a) * 5, cy + Math.sin(a) * 5, '#88837a'); }
    box(c, cx, cy, 1, 1, '#b0a898');
    for (const sx of p.boiler.stacks) if (Math.random() < 0.3) puff(sx + 2, Sy - 75, false, 4);
    if (Math.random() < 0.05) puff(p.hoist.x + p.hoist.w - 4, Sy - 30, true, 3);
    // a trip of cars waiting under the breaker pockets
    const cars = Math.min(6, 2 + Math.floor(upg('haulage') / 5));

    for (let k = 0; k < cars; k++) drawCar(c, bx + k * 13, Sy - 1, true, S.tier >= 3);
  } else {

    else { box(c, L.adit + 18, Sy - 4, 6, 2, '#5a4632'); box(c, L.adit + 17, Sy - 2, 2, 2, '#1a1918'); box(c, L.adit + 23, Sy - 6, 4, 1, '#5a4632'); }
  }
  if (p.fan) {
    const fx = p.fan.x + 6, fy = p.fan.y - 9;
    for (let k = 0; k < 3; k++) { const a = t * (3 + upg('vent')) + k * Math.PI / 3; line(c, fx - Math.cos(a) * 7, fy - Math.sin(a) * 7, fx + Math.cos(a) * 7, fy + Math.sin(a) * 7, '#7a6a58'); }
  }
  if (p.plant) for (let k = 0; k < p.plant.stacks; k++) if (Math.random() < 0.18) puff(p.plant.x + 6 + k * 10, Sy - 74, false, 5);
  if (S.tier >= 3 && Math.random() < 0.04) puff(p.culm.x + p.culm.w * rand(0.3, 0.7), Sy - p.culm.h * 0.6, false, 3);   // culm fires
  if (S.tier >= 3) {

  }

      box(c, x, Sy - 9, 22, 4, '#3a2420'); box(c, x, Sy - 6, 22, 1, '#7a2a1c'); box(c, x + 16, Sy - 14, 5, 5, '#e2ddd2'); box(c, x + 17, Sy - 17, 2, 3, '#2a2a2a');
      for (let k = 0; k < 3; k++) box(c, x + 3 + k * 4, Sy - 10, 3, 1, '#1a1a1c');
    }
    for (let x = p.sea.x; x < L.W; x += 5) box(c, x + Math.floor(t * 4) % 5, Sy - 3, 2, 1, 'rgba(255,255,255,.18)');
  }

function drawUnderDynamic(c, t, site, L) {

function drawLevelDyn(c, t, site, i, L, tool) {
  const lv = site.levels[i], y = L.y(i), top = y - L.th, x1 = L.x1, T = S.tier;
  const xs = L.drift ? Math.round(slopeX(L, y)) : L.x0;
  const nl = 1 + Math.min(upg('lighting'), 10), elec = T >= 3, lr = upg('lighting') * 2.5;
  for (let k = 0; k < nl; k++) {
    const lx = Math.round(xs + 12 + (k + 0.5) * (x1 - xs - 30) / nl);
    if (elec) { box(c, lx, top + 5, 2, 2, '#fff2c4'); lamp(lx + 1, top + 6, 28 + lr, 'cool', 0.85); }
    else { box(c, lx, top + 2, 1, 2, '#9c7a3c'); box(c, lx, top + 4, 1, 1, hash(Math.floor(t * 8) + k + i) > 0.3 ? '#ffcf70' : '#ff9f40'); lamp(lx, top + 4, 20 + lr, 'warm', 0.75); }
  }
  if (!L.drift) lamp(xs + 3, top + 6, 16, 'warm', 0.7);
  const crew = S.workers.filter(w => w.site === site.id && w.li === i);
  const halted = lv.haltUntil > S.time || site.haltUntil > S.time;
  const kind = lv.haltUntil > S.time ? lv.haltKind : site.haltKind;
  const rich = lv.richUntil > S.time;
  const active = crew.filter(w => w.injuredUntil <= S.time);
  const diggers = active.filter(w => w.role === 'digger'), haulers = active.filter(w => w.role === 'hauler');
  const support = active.filter(w => w.role !== 'digger' && w.role !== 'hauler');
  for (const w of crew) if (w.injuredUntil > S.time) drawMiner(c, xs + 16 + (w.id * 13) % Math.max(10, x1 - xs - 50), y - 1, w.role, { hurt: true });
  if (halted && kind !== 'strike') {
    active.forEach((w, k) => drawMiner(c, xs + 8 + k * 6, y - 1, w.role, { face: -1, frame: 0, act: 'idle' }));
  } else if (!halted) {
    const machine = tool >= 3 && diggers.length;
    if (machine) drawCutter(c, x1, y - 1, t, tool >= 4);
    diggers.forEach((w, k) => {
      const x = machine ? x1 - 40 - k * 8 : x1 - 9 - k * 8;
      const fr = Math.floor(t * (tool ? 8 : 3) + w.id * 1.7);
      drawMiner(c, x, y - 1, w.role, { face: 1, frame: fr, act: machine ? 'idle' : 'dig', tool });
      if (!machine && fr % 4 === 2 && Math.random() < 0.15) Rr.parts.push({ x: x1 - 4, y: y - 6, vx: -rand(0.2, 0.6), vy: -rand(0.2, 0.6), life: 24, max: 24, col: '20,20,22', s: 1, grav: true });
    });
    const muleEra = T >= 2 && !has('conveyor');
    haulers.forEach((w, k) => {
      const fr = Math.floor(t * 6 + w.id);
      if (has('conveyor')) {
        const x = xs + 20 + (k + 0.5) * (x1 - xs - 70) / Math.max(1, haulers.length);
        drawMiner(c, x, y - 1, w.role, { face: 1, frame: Math.floor(t * 2.5 + w.id), act: 'shovel' });
        return;
      }
      const span = Math.max(20, (x1 - 24 - diggers.length * 8) - (xs + 20));
      const ph = ((t * (muleEra ? 0.05 : 0.08) * (1 + upg('haulage') * 0.02) + k * 0.37 + w.id * 0.13) % 2 + 2) % 2;
      const toFace = ph < 1, face = toFace ? 1 : -1;
      const x = xs + 20 + (toFace ? ph : 2 - ph) * span;
      if (muleEra) {
        drawMule(c, x, y - 1, face, fr);
        drawCar(c, x - face * 14, y - 1, !toFace, false); drawCar(c, x - face * 27, y - 1, !toFace, false);
        drawMiner(c, x - face * 36, y - 1, w.role, { face, frame: fr, act: 'walk' });
      } else {
        drawCar(c, x + face * 8, y - 1, !toFace, false);
        drawMiner(c, x, y - 1, w.role, { face, frame: fr, act: 'push' });
      }
    });
    support.forEach((w, k) => {
      const x = Math.round(xs + 26 + (k + 0.5) * Math.max(14, x1 - xs - 110) / support.length);
      drawMiner(c, x, y - 1, w.role, { face: w.id % 2 ? 1 : -1, frame: Math.floor(t * 1.5 + w.id), act: 'idle' });
    });
    if (active.length && Math.random() < 0.08) Rr.parts.push({ x: rand(xs, x1), y: rand(top + 2, y - 2), vx: rand(-0.04, 0.04), vy: rand(-0.03, 0.02), life: 160, max: 160, col: '255,214,160', s: 1, a: 0.5 });
  }
  if (Math.random() < 0.01) Rr.parts.push({ x: rand(xs + 4, x1 - 4), y: top + 1, vx: 0, vy: 0.2, life: 30, max: 30, col: '120,160,190', s: 1, grav: true });
  if (rich) {
    for (let k = 0; k < L.th; k += 2) if (hash(k + i * 7 + Math.floor(t * 6)) < 0.5) box(c, x1 - 3 + (k % 3), top + k, 1, 1, '#ffd75a');
    lamp(x1 - 3, top + L.th / 2, 18, 'warm', 0.9);
    if (Math.random() < 0.25) Rr.parts.push({ x: x1 - 3, y: top + rand(1, L.th - 1), vx: -rand(0.1, 0.4), vy: -rand(0, 0.2), life: 30, max: 30, col: '255,215,90', s: 1 });
  }
  if (halted) {
    if (kind === 'cavein') {
      const mx = Math.round((xs + x1) / 2) + 10;
      for (let k = -18; k < 18; k++) {
        const h = Math.round((L.th + 2) * (1 - Math.abs(k) / 18) + (hash(k + i) - 0.5) * 3);
        for (let j = 0; j < h; j++) box(c, mx + k, y - j, 1, 1, hash(k * 3.1 + j * 7.3) < 0.3 ? '#6a5f52' : hash(k + j) < 0.6 ? '#4a3d30' : '#3a3026');
      }
      line(c, mx - 12, y - 2, mx + 6, top + 2, PAL.timber); line(c, mx + 2, y - 1, mx + 15, top + 4, PAL.timberLo);
    } else if (kind === 'flood') {
      const lvl = Math.round(L.th * 0.7 + Math.sin(t * 2) * 0.6);
      box(c, xs, y - lvl, x1 - xs, lvl, 'rgba(48,82,104,.88)');
      for (let x = xs + Math.floor(t * 5) % 5; x < x1; x += 5) box(c, x, y - lvl, 2, 1, 'rgba(180,210,230,.35)');
    } else if (kind === 'gas') {
      c.fillStyle = `rgba(140,170,90,${0.2 + Math.sin(t * 3) * 0.06})`; c.fillRect(xs, top, x1 - xs, L.th);
    }
  }
}
function drawLighting(c, L, site) {
  const lc = Rr.lctx, W = L.W, H = L.H, Sy = L.Sy;
  lc.globalCompositeOperation = 'source-over';
  lc.clearRect(0, 0, W, H);
  // the rock face of the cutaway stays readable; the workings themselves are near-black
  const g = lc.createLinearGradient(0, Sy, 0, H);
  g.addColorStop(0, 'rgba(4,3,2,0.25)'); g.addColorStop(1, 'rgba(4,3,2,0.6)');
  lc.fillStyle = g; lc.fillRect(0, Sy + 2, W, H - Sy - 2);

    const y = L.y(i), xs = L.drift ? Math.round(slopeX(L, y)) : L.x0;
    lc.fillRect(xs, y - L.th - 2, L.x1 - xs, L.th + 3);

  if (!L.drift) lc.fillRect(L.sx, Sy + 2, 12, L.y(site.levels.length - 1) + 8 - Sy);
  lc.globalCompositeOperation = 'destination-out';
  for (const l of Rr.lamps) { if (l.y < Sy) continue; lc.globalAlpha = l.a; lc.drawImage(Rr.spr.hole, l.x - l.r, l.y - l.r, l.r * 2, l.r * 2); }
  lc.globalAlpha = 1;
  c.drawImage(Rr.light, 0, 0);
  c.globalCompositeOperation = 'lighter';
  for (const l of Rr.lamps) { const r = l.r * 0.75; c.globalAlpha = 0.6 * l.a; c.drawImage(l.k === 'cool' ? Rr.spr.cool : Rr.spr.warm, l.x - r, l.y - r, r * 2, r * 2); }

function drawParticles(c) {
  const ps = Rr.parts;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.x += p.vx; p.y += p.vy; if (p.grav) p.vy += 0.05;
    if (--p.life <= 0) { ps.splice(i, 1); continue; }
    if (p.smoke || p.steam) {
      p.s += p.grow; p.vx += 0.002;
      c.globalAlpha = (p.life / p.max) * p.a;
      c.drawImage(p.steam ? Rr.spr.steam : Rr.spr.smoke, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      c.globalAlpha = 1;
    } else {
      const a = (p.a || 1) * Math.min(1, p.life / p.max * 2);
      c.fillStyle = `rgba(${p.col},${a})`; c.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.s), Math.round(p.s));

function drawScene(t) {
  const c = Rr.ctx, site = viewSite(), L = layout(site), p = surfacePlan(L);
  Rr.lamps = [];
  buildStrata();
  c.drawImage(underLayer(L, site), 0, 0);
  c.drawImage(surfaceLayer(L, site, p), 0, 0);
  drawSurfaceDynamic(c, t, L, site, p);
  drawUnderDynamic(c, t, site, L);
  drawParticles(c);
  drawLighting(c, L, site);

/* =====================================================================

const ui = { tab: 'workers', dirty: true, crewFilter: 'all', fireArm: 0, fireAt: 0 };
const TABS = [['workers', 'Workers'], ['upgrades', 'Upgrades'], ['sites', 'Sites'], ['events', 'Events'], ['prestige', 'Prestige'], ['records', 'Records'], ['settings', '⚙']];

function toast(msg, kind) {
  if (RT.sim) return;
  const el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > (innerWidth < 820 ? 2 : 4)) box.firstChild.remove();
  setTimeout(() => el.remove(), 4500);
}
function shake() {
  if (RT.sim || !S.meta.settings.shake) return;
  const v = $('#view'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake');
}
function showModal(html) { const m = $('#modal'); m.querySelector('.box').innerHTML = html; m.hidden = false; }
function closeModal() { $('#modal').hidden = true; }
function floatText(clientX, clientY, text, cls) {
  const r = $('#view').getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'float ' + (cls || '');
  el.textContent = text; el.style.left = (clientX - r.left) + 'px'; el.style.top = (clientY - r.top - 10) + 'px';

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${n}${k === 'events' && S.ev.cur ? '<span class="dot"></span>' : ''}${k === 'upgrades' && canTierUp() ? '<span class="dot"></span>' : ''}</button>`).join('');

    const r = el.getBoundingClientRect();

const BINDS = {
  payPct: () => Math.round(S.pay * 100) + '%',
  payMood: () => S.pay < 0.75 ? 'starvation wages' : S.pay < 0.98 ? 'tight-fisted' : S.pay <= 1.02 ? 'standard rate' : S.pay <= 1.35 ? 'generous' : S.pay <= 1.7 ? 'well paid' : 'lavish',
  payInfo: () => {
    const P = CONFIG.pay, out = payOutput(), share = Math.max(0, S.pay - 1) * P.bonusShare;
    const net = out * (1 - share);   // crew income relative to 100% pay, before wages
    return `Output <b class="${out >= 1 ? 'good' : 'bad'}">${pct(out)}</b> · wages ×${S.pay.toFixed(2)}${share ? ` · bonus ${Math.round(share * 100)}% of their coal` : ''}`
      + ` · strikes ×${Math.pow(1 / S.pay, P.strikePow).toFixed(1)}<br>Net from your crew ≈ <b class="${net >= 1 ? 'good' : 'bad'}">${pct(net)}</b>`;
  },
  poolRefresh: () => fmtTime(S.pool.refreshAt - S.time),
  arrive: el => { const sl = S.pool.slots[+el.dataset.i]; return sl ? fmtTime(sl.at - S.time) : ''; },
  nextEvent: () => fmtTime(S.ev.nextAt - S.time),
  buff: el => { const b = S.buffs.find(x => x.key === el.dataset.k); return b ? fmtTime(b.until - S.time) : 'ended'; },
  legacyGain: () => legacyGain(),
  tierCoal: () => { const t = nextTier(); return t ? `${fmt(S.run.coal)} / ${fmt(t.req.coal)}` : ''; },
  tierMoney: () => { const t = nextTier(); return t ? `${money(S.money)} / ${money(t.req.money)}` : ''; },
  wstat: el => {
    const w = S.workers.find(x => x.id === +el.dataset.w); if (!w) return '';
    const hurt = w.injuredUntil > S.time;
    const card = el.closest('.wcard'); if (card) card.classList.toggle('hurt', hurt);
    const r = CONFIG.roles[w.role];
    const out = w.role === 'digger' ? `digs ${fmt(w._out || 0)}/s` : w.role === 'hauler' ? `hauls ${fmt(w._out || 0)}/s` : esc(r.desc);
    // always three lines, so an injury doesn't change the card's height
    return `${hurt ? `<span class="bad">Injured, back in ${fmtTime(w.injuredUntil - S.time)} (unpaid)</span>` : '<span class="good">On shift</span>'}<br>${out}<br>Wage ${money(wageOf(w))}/s${w.wageMult > 1.01 ? ` <span class="faint">(${pct(w.wageMult)} creep)</span>` : ''}`;
  },
};
const PROGS = {
  tierCoal: () => { const t = nextTier(); return t ? S.run.coal / t.req.coal : 1; },
  tierMoney: () => { const t = nextTier(); return t ? S.money / t.req.money : 1; },
};

// Explain a mine that has workers but isn't producing, so the player isn't left guessing.
function noCoalReason(site, sd) {
  if (!site || !sd || sd.out > 0.001) return '';
  const crew = S.workers.filter(w => w.site === site.id);
  if (!crew.length) return '';
  if (site.haltUntil > S.time) return `the whole mine is shut (${site.haltKind || 'stoppage'}) for ${fmtTime(site.haltUntil - S.time)}`;
  const parts = [];
  site.levels.forEach((lv, li) => { if (lv.haltUntil > S.time && crew.some(w => w.li === li)) parts.push(`Level ${li + 1} shut by ${lv.haltKind === 'cavein' ? 'a cave-in' : lv.haltKind || 'a stoppage'} for ${fmtTime(lv.haltUntil - S.time)}`); });
  const diggers = crew.filter(w => w.role === 'digger'), hurt = diggers.filter(w => w.injuredUntil > S.time);
  if (!diggers.length) parts.push('no Diggers here to cut coal');
  else if (hurt.length === diggers.length) parts.push(`every Digger is injured (back in ${fmtTime(Math.min(...hurt.map(w => w.injuredUntil)) - S.time)})`);
  else if (sd.haul <= 0.001) parts.push('nothing is hauling coal up');
  return parts.join('; ') || 'the crew is idle';
}
function refreshUI() {
  $('#tierName').textContent = `${companyName()} · ${tierInfo(S.tier).name}`;
  $('#rCoal').textContent = fmt(S.coal);
  const sv = $('#rSave');
  if (Store.persistent) { sv.textContent = RT.savedAt ? `✓ saved ${fmtTime((Date.now() - RT.savedAt) / 1000)} ago` : '✓ remembered'; sv.className = 'val good'; }
  else { sv.textContent = '⚠ not saved'; sv.className = 'val bad'; }
  $('#rMoney').textContent = money(S.money);
  $('#rCps').textContent = fmt(D.cps);
  const pm = S.market.mult;
  $('#rPrice').innerHTML = `${money(D.price)} <span class="${pm >= 1 ? 'good' : 'bad'}" style="font-size:11px">${pm >= 1 ? '▲' : '▼'}${Math.round(Math.abs(pm - 1) * 100)}%</span>`;
  const sellRateNow = D.cps * D.price * (1 - D.payCut);
  const net = sellRateNow - D.wages;
  const nEl = $('#rNet'); nEl.textContent = money(net); nEl.className = 'val ' + (net >= 0 ? 'money' : 'bad');
  // buttons with costs
  for (const el of document.querySelectorAll('[data-cost]')) {
    let ok = S.money >= +el.dataset.cost;
    if (el.dataset.tier) ok = canTierUp();
    el.disabled = !ok;
  }
  for (const el of document.querySelectorAll('[data-bind]')) { const f = BINDS[el.dataset.bind]; if (f) { const v = String(f(el)); if (el._v !== v) { el.innerHTML = v; el._v = v; } } }
  for (const el of document.querySelectorAll('[data-prog]')) { const f = PROGS[el.dataset.prog]; if (f) el.style.width = clamp(f() * 100, 0, 100) + '%'; }
  // event timer
  const cur = S.ev.cur; const bar = document.querySelector('#eventBanner .evtimer i');
  if (cur && bar) bar.style.width = clamp((cur.expires - S.time) / CONFIG.events.decideSec * 100, 0, 100) + '%';
  // warnings over the mine
  const warns = [];
  if (D.unpaid) warns.push(['Payroll missed! Output halved until you can pay wages.', '']);
  const sd = D.sites[S.viewSite];
  const why = noCoalReason(viewSite(), sd);
  if (why) warns.push([`No coal: ${why}. Click the mine to dig by hand meanwhile.`, '']);
  if (sd && sd.dig > sd.haul * 1.05 && sd.dig > 0.5) warns.push([`Haul-limited: ${fmt(sd.dig - sd.haul)}/s of coal stuck underground`, '']);
  if (D.workers >= D.cap && D.cap > 0 && S.workers.length) warns.push(['All worker slots full', 'info']);
  if (canTierUp()) warns.push([`Ready: ${nextTier().buy} (Upgrades tab)`, 'info']);
  const wHtml = warns.map(([m, c]) => `<div class="${c}">${esc(m)}</div>`).join('');
  const wEl = $('#warn'); if (wEl._v !== wHtml) { wEl.innerHTML = wHtml; wEl._v = wHtml; }
}

  },
  openSave: () => { ui.tab = 'settings'; ui.dirty = true; renderPanel(); const h = document.querySelector('[data-k="hsave"]'); if (h) h.scrollIntoView({ block: 'start' }); },
  openSaving: () => {
    // hand the save over in the URL fragment (never sent to the server) to the copy served over http
    location.href = `${CONFIG.servedUrl}#save=${encodeURIComponent(encodeSave(serialize()))}`;
  },
  hardReset: () => {
    if (!ui.resetArm) { ui.resetArm = true; ui.dirty = true; setTimeout(() => { if (ui.resetArm) { ui.resetArm = false; ui.dirty = true; } }, 5000); return; }
    ui.resetArm = false; Store.del(CONFIG.saveKey); startRun(defaultMeta()); renderEventBanner(); save(); ui.dirty = true; toast('Everything wiped. Fresh hillside.', 'bad');
  },
  dbgSpeed: el => { RT.speed = +el.dataset.s; ui.dirty = true; },
  dbgMoney: () => { S.money += Math.max(1000, S.money * 9); },
  dbgCoal: () => { addCoal(Math.max(1000, S.run.coal * 9)); },
  dbgEvent: () => { S.ev.cur = null; spawnEvent(); if (!S.ev.cur) toast('No event could fire right now (need workers).'); },
  dbgTier: () => { const t = nextTier(); if (!t) return; if (S.run.coal < t.req.coal) addCoal(t.req.coal - S.run.coal); S.money = Math.max(S.money, t.req.money); },
  dbgLegacy: () => { S.meta.legacy += 10; ui.dirty = true; },
  dbgReset: () => { startRun(S.meta); renderEventBanner(); ui.dirty = true; toast('Run reset (Legacy kept).'); },
  dbgSim: el => {
    el.disabled = true; el.textContent = 'Simulating…';
    setTimeout(() => { const t0 = performance.now(); ui.simOut = simulatePacing(60, 4) + `\n(simulated in ${Math.round(performance.now() - t0)} ms; bot clicks 4/s for 5 min, then buys greedily)`; ui.dirty = true; }, 30);
  },
};

function bindInput() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const f = ACTIONS[el.dataset.act]; if (f) { f(el, e); recalc(); if (ui.dirty) renderPanel(); else refreshUI(); }   // your own clicks show at once
  });
  document.addEventListener('input', e => {
    if (e.target.dataset.pay == null) return;
    S.pay = clamp(+e.target.value, CONFIG.pay.min, CONFIG.pay.max);
    recalc(); refreshUI();
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.assign) { const [sid, li] = el.value.split(':').map(Number); assign(+el.dataset.assign, sid, li); recalc(); }
    if (el.dataset.toggle) {
      const k = el.dataset.toggle;
      if (k === 'shake') S.meta.settings.shake = el.checked; else S.auto[k] = el.checked;
    }
  });
  // hold off panel re-renders while a button is mid-press (so the click lands), but never for long
  document.addEventListener('pointerdown', e => {
    if (e.target.matches('input[type=range]')) RT.pointerDown = Infinity;   // dragging a slider: hold until release
    else if (e.target.closest('#panel, #eventBanner')) RT.pointerDown = performance.now();
  }, true);
  for (const ev of ['pointerup', 'pointercancel', 'blur']) window.addEventListener(ev, () => { RT.pointerDown = 0; }, true);
  const body = $('#tabBody');   // also hold re-renders while the pointer rests on the panel, so cards don't change under it
  body.addEventListener('pointerenter', () => { RT.hoverPanel = true; });
  body.addEventListener('pointerleave', () => { RT.hoverPanel = false; });
  Rr.cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const v = mineClick();
    floatText(e.clientX, e.clientY, '+' + fmt(v));
    const r = Rr.cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / Rr.px, y = (e.clientY - r.top) / Rr.px;
    for (let i = 0; i < 6; i++) Rr.parts.push({ x, y, vx: rand(-0.8, 0.8), vy: rand(-1.4, -0.3), life: 26, max: 26, col: i % 3 ? '18,18,20' : '255,200,110', s: 1, grav: true });
    if (S.run.clicks === 1) $('#hint').textContent = 'coal is sold automatically';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.target.matches('#modal input')) { const b = $('#modal button.primary'); if (b) b.click(); }
  });
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else RT.lastFrame = performance.now(); });
  window.addEventListener('beforeunload', save);
}

/* =====================================================================
   7. MAIN LOOP & BOOT
   ===================================================================== */
const pressing = () => RT.pointerDown && performance.now() - RT.pointerDown < 600;
let lastWall = Date.now();
// The simulation follows the wall clock, so background tabs (where rAF stops) still progress.
function pump() {
  const wall = Date.now(); const dt = (wall - lastWall) / 1000; lastWall = wall;
  if (dt <= 0) return;
  if (dt > 60) { showOffline(runOffline(dt)); ui.dirty = true; return; }   // tab was asleep: offline rules
  stepGame(dt * RT.speed);
  RT.slowAt += dt * RT.speed;
  while (RT.slowAt >= 1) { RT.slowAt -= 1; slowTick(); }
  RT.saveAt += dt;
  if (RT.saveAt >= CONFIG.autosaveSec) { RT.saveAt = 0; save(); }
}
setInterval(() => { if (performance.now() - RT.lastRaf > 1500) pump(); }, 1000);   // rAF stalled (hidden tab)
function frame(now) {
  const dt = clamp((now - RT.lastFrame) / 1000, 0, 1); RT.lastFrame = now; RT.lastRaf = performance.now();
  pump();
  // background changes wait while the pointer rests on the panel (up to 5s), so cards don't move under it
  if (ui.dirty && !ui.dirtySince) ui.dirtySince = now;
  if (ui.dirty && !pressing() && (!RT.hoverPanel || now - ui.dirtySince > 5000)) renderPanel();
  RT.uiAt += dt;
  if (RT.uiAt >= 0.25) { RT.uiAt = 0; refreshUI(); }
  // periodic full re-render for the number-heavy tabs
  RT.panelAt += dt;
  if (RT.panelAt >= 1.5) { RT.panelAt = 0; if (['sites', 'events', 'records', 'prestige'].includes(ui.tab) && !pressing()) ui.dirty = true; }
  if (S.ev.cur && $('#eventBanner').hidden) renderEventBanner();
  if (!S.ev.cur && !$('#eventBanner').hidden) renderEventBanner();
  Rr.t += dt;
  drawScene(Rr.t);
  requestAnimationFrame(frame);
}

function boot() {
  Rr.cv = $('#mine'); Rr.ctx = Rr.cv.getContext('2d');
  Rr.light = document.createElement('canvas'); Rr.lctx = Rr.light.getContext('2d');
  let offline = null;
  try {
    let raw = Store.get(CONFIG.saveKey);
    const m = location.hash.match(/^#save=(.+)$/);
    if (m) {   // progress carried over from the no-save preview: keep whichever save is newer
      try {
        const incoming = decodeSave(decodeURIComponent(m[1]));
        const mine = raw ? JSON.parse(raw).lastSeen || 0 : 0;
        if ((JSON.parse(incoming).lastSeen || 0) >= mine) { raw = incoming; RT.carried = true; }
      } catch (e) { console.warn('Carried-over save was unreadable.', e); }
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (raw) { S = loadFrom(raw); recalc(); offline = runOffline((Date.now() - S.lastSeen) / 1000); if (RT.carried) save(); }
  } catch (e) { console.warn('Save could not be loaded, starting fresh.', e); S = null; }
  if (!S) startRun(defaultMeta());
  recalc();
  bindInput();
  resizeCanvas();
  renderPanel();
  renderEventBanner();
  if (offline) showOffline(offline);
  else if (!S.meta.clicks) showModal(`<h2>Coal Empire</h2>
    <p>You own a hillside near Shenandoah, a pick, and a dream.</p>
    <p><b>Click the mine</b> to dig coal. It sells automatically at the market price. Hire Diggers to cut coal and Haulers to bring it up, open deeper levels, and grow from a drift mine into a global empire.</p>
    <p class="dim">Progress saves every ${CONFIG.autosaveSec}s and keeps going (up to ${CONFIG.offlineCapHours}h) while the tab is closed.</p>
    <label class="dim" style="display:block;margin-top:8px">Name your mine</label>
    <input id="startMine" maxlength="${NAME_MAX}" placeholder="${esc(S.sites[0].name)}" style="width:100%;padding:6px">
    <label class="dim" style="display:block;margin-top:6px">Company name <span class="faint">(optional)</span></label>
    <input id="startCompany" maxlength="${NAME_MAX}" placeholder="${esc(companyName())}" style="width:100%;padding:6px">
    <button class="primary" data-act="startGame" style="margin-top:12px">Grab the pick</button>`);
  if (RT.carried) setTimeout(() => toast('Progress carried over. It will be remembered here from now on.', 'good'), 800);
  if (!Store.persistent) setTimeout(() => toast('This preview can\'t remember progress. Click "Progress" in the top bar to open the version that saves.', 'bad'), 1500);
  RT.lastFrame = performance.now();
  requestAnimationFrame(frame);
}
boot();

// handy from the console: CoalEmpire.sim(60)
window.CoalEmpire = { get state() { return S; }, get derived() { return D; }, CONFIG, sim: (m, c) => simulatePacing(m || 60, c == null ? 4 : c), save };
</script>
</body>
</html>
